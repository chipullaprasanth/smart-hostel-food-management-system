<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hostel AI - Login</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(19, 26, 38, 0.85);
            border: 1px solid #223047;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }

        .form-control {
            background-color: #0b0f19 !important;
            border: 1px solid #223047 !important;
            color: #f8fafc !important;
            border-radius: 8px;
            padding: 12px 14px;
        }

        .form-control:focus {
            box-shadow: 0 0 0 2px rgba(0, 242, 254, 0.2);
            border-color: #00f2fe !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    <div class="mb-4">
        <i class="fa-solid fa-leaf text-info fs-1 mb-2"></i>
        <h4 class="fw-bold mb-1">Smart Hostel AI</h4>
        <p class="text-secondary small">Administrator Secure Console</p>
    </div>

    <!-- Alert notifications -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-danger border-0 small py-2 text-white" style="background: rgba(239, 68, 68, 0.25);" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-2"></i>{{ msg }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3 text-start">
            <label for="username" class="form-label small text-secondary">Username</label>
            <input type="text" id="username" name="username" placeholder="e.g. admin" class="form-control" required>
        </div>

        <div class="mb-4 text-start">
            <label for="password" class="form-label small text-secondary">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">
            Sign In <i class="fa-solid fa-right-to-bracket ms-2"></i>
        </button>
    </form>

    <div class="small text-secondary mt-3">
        Back to <a href="/" class="text-info text-decoration-none">Home Portal</a> | Don't have an account? <a href="/register" class="text-info text-decoration-none">Sign Up</a>
    </div>
</div>

</body>
</html>
